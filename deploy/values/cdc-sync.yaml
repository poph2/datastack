# CDC Sync daemon. Deployed as release "cdc-sync-service" (make deploy-cdc-sync).
# It owns no database: no CNPG Database, no migrate initContainer. It still
# gets PGUSER/PGPASSWORD from the CNPG secret and reads every service's
# database with them. Needs StarRocks: kubectl apply -f deploy/infra/starrocks.yaml
image:
  repository: datastack/cdc-sync

port: 8090

# A singleton: two copies would load every batch twice (harmless upserts,
# but wasted work and confusing /status). Recreate never overlaps pods.
replicaCount: 1
strategy:
  type: Recreate

postgres:
  database: ""

migrations:
  enabled: false

env:
  LOG_LEVEL: info
  LOG_FORMAT: json
  # No database in the path: each table's database is set per source.
  POSTGRES_URL: "postgres://datastack-pg-rw:5432/?sslmode=require"
  TABLES: "customers.customers,marketing.campaigns,marketing.attributions,inventory.inventory,payments.payments,shipments.shipments,orders.orders"
  STARROCKS_MYSQL_ADDR: "starrocks:9030"
  # Stream Load goes straight to the BE, not via the FE's redirect.
  STARROCKS_LOAD_URL: "http://starrocks:8040"
  STARROCKS_DB: analytics_db
  STARROCKS_USER: root
  POLL_INTERVAL: 5s
  BATCH_SIZE: "1000"
  SAFETY_LAG: 2s

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
