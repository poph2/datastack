# OpenTelemetry Collector (chart open-telemetry/opentelemetry-collector).
# Installed by `make observability` as release "otel-collector", which is also
# its Service name. Every Go service exports spans here over OTLP gRPC
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317, set in the
# go-service chart). Traces only: Prometheus scrapes service metrics itself.

mode: deployment
replicaCount: 1
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib

# Only OTLP in. The chart's default Jaeger and Zipkin ports are switched off.
ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

# The collector's own metrics (otelcol_receiver_accepted_spans and friends)
# on :8888, picked up by Prometheus's annotation-based kubernetes-pods job.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  prometheus.io/path: /metrics

# The chart merges this over its defaults; null removes a default component.
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      timeout: 2s
      send_batch_size: 1024
  exporters:
    debug: null
    otlp_grpc/tempo:
      endpoint: tempo:4317
      tls:
        insecure: true
  service:
    pipelines:
      logs: null
      metrics: null
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 192Mi

# Lenient probes, as in the go-service chart. The chart's defaults (1s
# timeout, 10s period) restart the collector whenever image builds or StarRocks
# starve the kind node of CPU, and a CPU-throttled contrib collector can take
# over 30s to start. The startup probe allows up to 3 minutes for that.
startupProbe:
  httpGet:
    port: 13133
  periodSeconds: 5
  failureThreshold: 36
livenessProbe:
  httpGet:
    port: 13133
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  httpGet:
    port: 13133
  periodSeconds: 5
  timeoutSeconds: 3
