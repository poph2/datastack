# Grafana Tempo, single binary (chart grafana/tempo). Installed by
# `make observability` as release "tempo", which is also its Service name:
# OTLP gRPC ingest on tempo:4317 (fed by the collector), query API on
# tempo:3200 (the chart hard-codes 3200 for the HTTP port).
#
# The metrics-generator turns spans into Prometheus series and remote-writes
# them to prometheus:9090. service-graphs powers Grafana's service map
# (traces_service_graph_request_total{client,server}); span-metrics gives
# RED metrics per service and span (traces_spanmetrics_*).

fullnameOverride: tempo

tempo:
  # The default 1 GB ballast is far too much for a laptop cluster.
  memBallastSizeMbs: 0
  reportingEnabled: false
  # 2h, not 24h. Nothing in the demo looks further back than an hour: the web
  # UI's "View trace" link opens a now-1h window and the sidebar's Tempo link
  # now-15m. A day of blocks is what made Tempo grow until it was OOMKilled
  # about every 70 minutes under load, which is well inside a talk.
  retention: 2h

  # Spans arrive over OTLP from the collector. The chart's Jaeger receivers
  # stay (its port templates require them); nothing sends to them.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus:9090/api/v1/write
    registry:
      external_labels:
        source: tempo
    processor:
      service_graphs:
        dimensions: []
        wait: 10s
      span_metrics:
        dimensions: []

  # Processors are switched on per tenant through the overrides.
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs, span-metrics]

  # 4Gi. Tempo blanks the service map and the "View trace" links whenever it is
  # killed, so this is the one observability pod worth over-provisioning. The
  # history: 640Mi lasted minutes, 1536Mi with 24h retention lasted about 70,
  # and 1536Mi with the 2h retention above still OOMKilled 11 times in seven
  # days. Sampling RSS every five minutes never caught it above 246 MiB, so it
  # is a burst - compaction is the suspect - rather than steady growth, and the
  # fix is headroom for the burst, not a lower steady state. The demo machine
  # has it spare.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 4Gi

# Local storage on the pod (emptyDir). Traces live 24h at most anyway.
persistence:
  enabled: false
