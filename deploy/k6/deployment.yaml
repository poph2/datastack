# Continuous k6 load against the services in the cluster. The script comes
# from the k6-script ConfigMap, which `make load` creates from
# deploy/k6/checkout-journey.js. Change the rate with
# `make load RATE=20`, and stop the load with `make load-stop`.
#
# k6 exits after DURATION, and Kubernetes restarts it, so the load is
# effectively endless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6
  labels:
    app.kubernetes.io/name: k6
    app.kubernetes.io/part-of: datastack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6
        app.kubernetes.io/part-of: datastack
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:1.3.0
          args: ["run", "--quiet", "/scripts/checkout-journey.js"]
          env:
            - name: RATE
              value: "5"
            - name: DURATION
              value: 24h
            - name: CUSTOMER_URL
              value: http://customer-service:8081
            - name: MARKETING_URL
              value: http://marketing-service:8082
            - name: INVENTORY_URL
              value: http://inventory-service:8083
            - name: ORDER_URL
              value: http://order-service:8080
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scripts
          configMap:
            name: k6-script
