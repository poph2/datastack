# The web UI's load page reads and patches the k6 Deployment (RATE env and
# replicas) through the Kubernetes API, as this ServiceAccount. It can touch
# nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: datastack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-k6-control
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: datastack
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["k6"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-k6-control
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: datastack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-k6-control
subjects:
  - kind: ServiceAccount
    name: web
