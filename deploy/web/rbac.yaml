# The web UI talks to the Kubernetes API as this ServiceAccount, for two
# read-only-ish things: the load page reads and patches the k6 Deployment
# (RATE env and replicas), and the stack landscape lists pods to show a live
# dot next to each tool. It can touch nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: datastack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-k6-control
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: datastack
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["k6"]
    verbs: ["get", "patch"]
  # The stack landscape's live dots. Listing pods cannot be narrowed with
  # resourceNames (a list call has no name), so this is list-only on pods in
  # this namespace, and nothing else.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-k6-control
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: datastack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-k6-control
subjects:
  - kind: ServiceAccount
    name: web
