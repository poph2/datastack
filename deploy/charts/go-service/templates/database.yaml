{{- if .Values.postgres.database }}
# The service declares the database it owns. CNPG creates it in the shared
# cluster, and the service's own `migrate up` creates the tables inside it.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ include "go-service.name" . }}
  labels:
    {{- include "go-service.labels" . | nindent 4 }}
spec:
  name: {{ .Values.postgres.database }}
  owner: {{ .Values.postgres.owner }}
  cluster:
    name: {{ .Values.postgres.cluster }}
{{- end }}
