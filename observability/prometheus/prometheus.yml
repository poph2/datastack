global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          source: postgres
          service: postgres

  - job_name: starrocks-fe
    metrics_path: /metrics
    static_configs:
      - targets:
          - starrocks:8030
        labels:
          service: starrocks-fe

  - job_name: starrocks-be
    metrics_path: /metrics
    static_configs:
      - targets:
          - starrocks:8040
        labels:
          service: starrocks-be

  - job_name: go-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: backend
