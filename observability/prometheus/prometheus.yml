global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: nats
    static_configs:
      - targets:
          - nats-exporter:7777

  - job_name: postgres
    static_configs:
      - targets:
          - orders-postgres-exporter:9187
        labels:
          source: orders
      - targets:
          - crm-postgres-exporter:9187
        labels:
          source: crm
      - targets:
          - inventory-postgres-exporter:9187
        labels:
          source: inventory

  - job_name: clickhouse
    static_configs:
      - targets:
          - clickhouse:9363

  - job_name: go-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: backend
      - targets:
          - host.docker.internal:8081
        labels:
          service: scenario-orchestrator
      - targets:
          - host.docker.internal:8082
        labels:
          service: orders-simulator
      - targets:
          - host.docker.internal:8083
        labels:
          service: crm-simulator
      - targets:
          - host.docker.internal:8084
        labels:
          service: inventory-simulator