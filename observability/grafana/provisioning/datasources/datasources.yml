apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    jsonData:
      defaultDatabase: analytics
      port: 8123
      protocol: http
      server: clickhouse
      username: default
    secureJsonData:
      password: ""
    editable: true

  - name: StarRocks
    uid: starrocks
    type: mysql
    access: proxy
    url: starrocks:9030
    database: information_schema
    user: root
    secureJsonData:
      password: ""
    editable: true
