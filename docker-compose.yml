# Local Postgres for running services with `go run` (see `make run-<service>`).
# The full stack runs on kind; see the Makefile's kind-* and deploy-* targets.
name: datastack

services:
  postgres:
    image: postgres:18-alpine
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.00
    environment:
      POSTGRES_DB: datastack
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5433:5432"
    volumes:
      # postgres:18+ images store data under a pg_ctlcluster-style layout at /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d datastack"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
