name: datastack

services:
  postgres:
    image: postgres:18-alpine
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.00
    environment:
      POSTGRES_DB: datastack
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5433:5432"
    volumes:
      # postgres:18+ images store data under a pg_ctlcluster-style layout at /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d datastack"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - datastack

  nats:
    image: nats:2.10-alpine
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.50
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - datastack

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.20
    command: ["-varz", "http://nats:8222"]
    ports:
      - "7777:7777"
    depends_on:
      - nats
    networks:
      - datastack

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.00
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9363:9363"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./observability/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - datastack

  starrocks:
    image: starrocks/allin1-ubuntu:3.3-latest
    # Same budget as clickhouse for an apples-to-apples memory comparison.
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.00
    ports:
      - "8030:8030" # FE HTTP
      - "9030:9030" # FE MySQL protocol
      - "8040:8040" # BE HTTP
    volumes:
      - starrocks_data:/data/deploy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/api/health | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - datastack

  metabase:
    image: metabase/metabase:v0.50.26
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.50
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - datastack

  backend:
    build:
      context: ./services/backend
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.00
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - datastack

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.20
    environment:
      DATA_SOURCE_NAME: postgresql://demo:demo@postgres:5432/postgres?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - datastack

  prometheus:
    image: prom/prometheus:v2.54.1
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.00
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nats-exporter
      - postgres-exporter
      - clickhouse
      - backend
    networks:
      - datastack

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.00
    environment:
      # Server-side only: the Next.js server queries Prometheus directly over the compose network.
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "3002:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - datastack

networks:
  datastack:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  metabase_data:
  prometheus_data:
  starrocks_data: